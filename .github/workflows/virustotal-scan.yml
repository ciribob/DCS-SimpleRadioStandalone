name: VirusTotal Scan
on:
  workflow_call:
    inputs:
      srs-zip-id:
        type: number
        required: true
    secrets:
      vtcli-apikey:
        required: true

jobs:
  scan:
    name: virustotal-scan
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: sudo apt-get install -y unzip
      - name: vt-cli
        run: |
          gh release download --repo VirusTotal/vt-cli --pattern 'Linux64.zip'
          unzip Linux64.zip
          chmod +x vt
      - name: yq YAML parser
        run: |
          gh release download --repo mikefarah/yq --pattern 'yq_linux_amd64.tar.gz'
          tar xzf yq_linux_amd64.tar.gz
          chmod +x yq_linux_amd64
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.srs-zip-id }}
      - name: Display structure of downloaded files
        run: ls -R
      - name: VirusTotal Scan
        env:
          VTCLI_APIKEY: ${{ secrets.vtcli-apikey }}
        run: |
          FILES=(./Installer.exe \
            ./SRS-AutoUpdater.exe \
            ./Client/SR-ClientRadio.exe \
            ./ExternalAudio/DCS-SR-ExternalAudio.exe \
            ./Server/SRS-Server.exe \
            ./ServerCommandLine-Windows/SRS-Server-Commandline.exe \
            ./Scripts/DCS-SRS/bin/lua-srs.dll)
          for file in "${FILES[@]}"; do
            echo "Scanning $file..."
            ./vt scan file $file --silent --wait > result.yaml
            result_id=$(./yq_linux_amd64 '.[0]._id' result.yaml)
            malicious_count=$(./yq_linux_amd64 '.[0].last_analysis_stats.malicious' result.yaml)
            suspicious_count=$(./yq_linux_amd64 '.[0].last_analysis_stats.suspicious' result.yaml)
            echo "https://www.virustotal.com/gui/file/$result_id"
            if [ "$malicious_count" -gt "0" ]; then
              echo "::error file=$file::Reported malicious!"
            fi
            if [ "$suspicious_count" -gt "0" ]; then
              echo "::warn file=$file::Reported suspicious."
            fi
            rm result.yaml
          done
name: Release
on:
  push:
    tags:
      - '[0-9].[0-9].[0-9].[0-9]'
jobs:
  publish:
    name: publish
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: nuget/setup-nuget@v3
    - name: Restore NuGet packages
      run: nuget restore
    - name: Publish
      run: ./publish.ps1 -NoSign
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: DCS-SimpleRadioStandalone-${{ github.ref_name }}.zip
        path: install-build
  sign:
    name: Sign
    needs: publish
    runs-on: ubuntu-latest
    environment: signing
    steps:
    - name: Download
      uses: actions/download-artifact@v8
      with:
        name: DCS-SimpleRadioStandalone-${{ github.ref_name }}.zip
        path: install-build
    - name: Download ssign
      run: |
        curl -sSL -o ssign.tar.gz https://github.com/Le-Syl21/ssign/releases/download/v0.1.5/ssign-linux-x86_64.tar.gz
        tar -xzf ssign.tar.gz
        chmod +x ssign
    - name: Sign binaries
      run: |
        cd install-build
        find . -type f \( -name '*.exe' -o -name 'srs.dll' \) ! -name 'VC_redist*' -print0 \
          | xargs -0 -r "$GITHUB_WORKSPACE/ssign" --verbose
      env:
        CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
        CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
    - name: Verify signatures
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
        cd install-build
        FAILED=0
        while IFS= read -r -d '' f; do
          out=$(osslsigncode verify "$f" 2>&1)
          echo "== $f"
          echo "$out"
          echo "$out" | grep -q "MISMATCH" && { echo "::error::$f digest mismatch"; FAILED=1; }
          echo "$out" | grep -q "Timestamp is not available" && { echo "::error::$f no RFC3161 timestamp"; FAILED=1; }
          echo "$out" | grep -q "Signature verification: ok" || { echo "::error::$f verification failed"; FAILED=1; }
        done < <(find . -type f \( -name '*.exe' -o -name 'srs.dll' \) ! -name 'VC_redist*' -print0)
        exit $FAILED
    - name: Upload signed
      uses: actions/upload-artifact@v7
      with:
        name: DCS-SimpleRadioStandalone-${{ github.ref_name }}.zip
        path: install-build

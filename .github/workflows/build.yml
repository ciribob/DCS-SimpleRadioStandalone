name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    name: Tests
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: "**/packages.lock.json"
    - run: dotnet restore --runtime win-x64 --locked-mode
    - run: dotnet test --configuration Release --runtime win-x64 --no-restore
  publish:
    name: publish
    runs-on: windows-2025
    outputs:
      srs-install-zip: ${{ steps.upload.outputs.artifact-id }}
      artifact-slug: ${{ steps.artifact-slug.outputs.slug }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: "**/packages.lock.json"
    - name: Publish
      run: ./publish.ps1 -NoSign
    - name: Artifact basename
      id: artifact-slug
      run: |
        $stripped="${{ case(github.event_name == 'pull_request', github.head_ref, github.ref_name) }}".Replace('/', '-')
        echo "slug=$stripped" >> "$env:GITHUB_OUTPUT"
    - name: upload
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: DCS-SimpleRadioStandalone-${{ steps.artifact-slug.outputs.slug }}-unsigned
        path: install-build
        retention-days: 1
  sign:
    if: ${{ github.event_name != 'pull_request' && github.repository == 'ciribob/DCS-SimpleRadioStandalone' }}
    permissions:
      actions: read
      contents: read
    needs: publish
    name: Sign (Test)
    uses: $/.github/workflows/signing.yml
    with:
      policy: test
      artifact-id: ${{ fromJSON(needs.publish.outputs.srs-install-zip) }}
      artifact-slug: ${{ needs.publish.outputs.artifact-slug }}-signed
    secrets:
      organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
  scan:
    if: ${{ github.event_name != 'pull_request' && github.repository == 'ciribob/DCS-SimpleRadioStandalone' }}
    needs: sign
    name: virustotal-scan
    uses: $/.github/workflows/virustotal-scan.yml
    with:
      srs-zip-id: ${{ fromJSON(needs.sign.outputs.scan-zip-id) }}
    secrets:
      vtcli-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}

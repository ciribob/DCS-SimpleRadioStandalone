name: VirusTotal Scan
on:
  workflow_call:
    inputs:
      srs-zip-id:
        type: number
        required: true
    secrets:
      vtcli-apikey:
        required: true

jobs:
  scan:
    name: virustotal-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        id: artifact
        background: true
        with:
          artifact-ids: ${{ inputs.srs-zip-id }}
      - name: Dependencies
        id: unzip
        background: true
        run: sudo apt-get install -y unzip
      - name: Download vt-clifrom GitHub
        id: vt-cli
        background: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo VirusTotal/vt-cli --pattern 'Linux64.zip'
      - uses: actions/checkout@v7
        background: true
        id: checkout
        with:
          sparse-checkout: .github/scripts/virustotalresults.py
      - name: Wait vt-cli download
        wait: [unzip, vt-cli]
      - name: Setup vt-cli
        run: |
          unzip Linux64.zip
          chmod +x vt
      - name: Wait artifact download
        wait: artifact
      - name: Display structure of downloaded files
        run: ls -R
      - name: VirusTotal Scan
        env:
          VTCLI_APIKEY: ${{ secrets.vtcli-apikey }}
        run: |
          cat <<EOF | ./vt scan file - --silent --wait --include='_id,meaningful_name,last_analysis_stats.*' --format json > results.json
          ./Installer.exe
          ./SRS-AutoUpdater.exe
          ./Client/SR-ClientRadio.exe
          ./ExternalAudio/DCS-SR-ExternalAudio.exe
          ./Server/SRS-Server.exe
          ./ServerCommandLine-Windows/SRS-Server-Commandline.exe
          ./Scripts/DCS-SRS/bin/lua-srs.dll
          EOF

          cat results.json
      - name: Wait checkout
        wait: checkout
      - name: Check scan
        run: |
          chmod +x .github/scripts/virustotalresults.py
          .github/scripts/virustotalresults.py results.json
name: Signing (SignPath)
on:
  workflow_call:
    inputs:
      policy:
        type: string
        required: true
      artifact-id:
        type: number
        required: true
      artifact-slug:
        type: string
        required: true
    outputs:
      install-zip-id:
        value: ${{ jobs.sign.outputs.install-zip-id }}
    secrets:
      organization-id:
        required: true
      api-token:
        required: true

jobs:
  sign:
    name: Sign (${{ inputs.policy }})
    runs-on: ubuntu-slim
    outputs:
      install-zip-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - name: submit signing request
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.api-token }}'
        organization-id: '${{ secrets.organization-id }}'
        project-slug: 'DCS-SimpleRadioStandalone'
        signing-policy-slug: '${{ inputs.policy }}-signing'
        artifact-configuration-slug: 'dotnet-srs-dll'
        github-artifact-id: '${{ inputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: signed
        skip-decompress: true
    - name: Rename artifact
      run: mv signed/DCS-SimpleRadioStandalone-*-unsigned.zip signed/DCS-SimpleRadioStandalone-${{ inputs.artifact-slug }}.zip
    - name: Upload (signed)
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: DCS-SimpleRadioStandalone-${{ inputs.artifact-slug }}
        path: signed/DCS-SimpleRadioStandalone-${{ inputs.artifact-slug }}.zip
